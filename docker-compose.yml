services:
  caddy:
    image: caddy:2.9-alpine
    container_name: vigilone-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  mediamtx:
    # Pinned to specific verified stable tag with FFmpeg binaries
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: vigilone-mediamtx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Dedicated WebRTC ICE Media Transport (UDP + TCP fallback)
      - "8189:8189/udp"
      - "8189:8189/tcp"
      # MediaMTX port 8554 (RTSP) is NOT mapped to host - strictly internal Docker network!
      # Port 9997 (Control API) is NOT mapped to host - strictly internal Docker network!
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=${LAN_IP:-127.0.0.1}
      - RECORD_SEGMENT_DURATION=${RECORD_SEGMENT_DURATION:-10m}
      - RECORD_PART_DURATION=${RECORD_PART_DURATION:-1s}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9997/v3/paths/list || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  postgres:
    image: postgres:16-alpine
    container_name: vigilone-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilone_dev_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vigilone_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilone-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vigilone}:${POSTGRES_PASSWORD:-vigilone_dev_secret_2026}@postgres:5432/${POSTGRES_DB:-vigilone_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-vigilone_dev_jwt_signing_key_32bytes_min!}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-eGlhOHBqa2w4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      - MANAGEMENT_IP=${MANAGEMENT_IP:-127.0.0.1}
      - RECORDINGS_DIR=/recordings
      - EXPORTS_DIR=/recordings/exports
      - LAN_IP=${LAN_IP:-127.0.0.1}
      - RECORD_SEGMENT_DURATION=${RECORD_SEGMENT_DURATION:-10m}
    volumes:
      - recordings_data:/recordings
      - appliance_keys:/etc/vigilone
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilone-frontend
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - frontend_dist:/srv/frontend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  # Synthetic test camera - isolated under profile 'test' (never runs in production)
  synthetic-camera:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: vigilone-synthetic-camera
    profiles: ["test"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - ffmpeg
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=1280x720:rate=25
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "50"
      - -f
      - rtsp
      - rtsp://internal:vigilone_internal_secret_token_98234@mediamtx:8554/synthetic_test_stream
    depends_on:
      - mediamtx
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

networks:
  vigilone-net:
    driver: bridge

volumes:
  pg_data:
  recordings_data:
  appliance_keys:
  caddy_data:
  caddy_config:
  frontend_dist:

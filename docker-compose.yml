# ==============================================================================
# VigilOne VMS - Production Edge Surveillance Appliance
# SECURITY NOTICE:
# For production deployments, DO NOT rely on development fallback defaults.
# Configure a production `.env` file containing cryptographically random values:
# - JWT_SECRET (min 32 characters)
# - INTERNAL_API_SECRET (min 32 characters)
# - COTURN_SECRET (min 32 characters)
# - POSTGRES_PASSWORD
# - SETUP_TOKEN
# In NODE_ENV=production, backend config performs mandatory fail-fast validation.
# ==============================================================================

services:
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vigilone-gateway:latest
    container_name: vigilone-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  mediamtx:
    # Pinned to specific verified stable tag with FFmpeg binaries
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: vigilone-mediamtx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Dedicated WebRTC ICE Media Transport (UDP + TCP fallback)
      - "8189:8189/udp"
      - "8189:8189/tcp"
      # MediaMTX port 8554 (RTSP) is NOT mapped to host - strictly internal Docker network!
      # Port 9997 (Control API) is NOT mapped to host - strictly internal Docker network!
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=${LAN_IP:-127.0.0.1}
      - RECORD_SEGMENT_DURATION=${RECORD_SEGMENT_DURATION:-10m}
      - RECORD_PART_DURATION=${RECORD_PART_DURATION:-1s}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9997/v3/paths/list || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  postgres:
    image: postgres:16-alpine
    container_name: vigilone-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilone_dev_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vigilone_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilone-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vigilone}:${POSTGRES_PASSWORD:-vigilone_dev_secret_2026}@postgres:5432/${POSTGRES_DB:-vigilone_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-vigilone_dev_jwt_signing_key_32bytes_min!}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-eGlhOHBqa2w4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      # No default: install.sh generates a random SETUP_TOKEN; in development the backend generates
      # an ephemeral one and logs it. Production refuses to start without a strong token.
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - MANAGEMENT_IP=${MANAGEMENT_IP:-127.0.0.1}
      - RECORDINGS_DIR=/recordings
      - EXPORTS_DIR=/recordings/exports
      - LAN_IP=${LAN_IP:-127.0.0.1}
      - COTURN_SECRET=${COTURN_SECRET:-vigilone_turn_secret_dev_38921}
      - COTURN_HOST=${COTURN_HOST:-turn.vigilone.internal}
      - COTURN_PORT=${COTURN_PORT:-3478}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
      - RECORD_SEGMENT_DURATION=${RECORD_SEGMENT_DURATION:-10m}
      # Feature flags (docs/operations/FEATURE_FLAGS.md): unproven subsystems stay OFF by default
      - VIGILONE_FEATURE_FEDERATION=${VIGILONE_FEATURE_FEDERATION:-false}
      - VIGILONE_FEATURE_OBJECT_STORAGE_ARCHIVE=${VIGILONE_FEATURE_OBJECT_STORAGE_ARCHIVE:-false}
      - VIGILONE_FEATURE_OIDC_SSO=${VIGILONE_FEATURE_OIDC_SSO:-false}
      - VIGILONE_FEATURE_DIO_RELAY=${VIGILONE_FEATURE_DIO_RELAY:-false}
      - VIGILONE_FEATURE_ANPR=${VIGILONE_FEATURE_ANPR:-false}
      - VIGILONE_FEATURE_REDACTION=${VIGILONE_FEATURE_REDACTION:-false}
      - REDACTION_ADAPTER_URL=http://127.0.0.1:7012
      - VIGILONE_FEATURE_SMART_SEARCH=${VIGILONE_FEATURE_SMART_SEARCH:-false}
      - VIGILONE_FEATURE_FLOORPLANS=${VIGILONE_FEATURE_FLOORPLANS:-false}
      - VIGILONE_FEATURE_CAMERA_EVENTS=${VIGILONE_FEATURE_CAMERA_EVENTS:-false}
      - VIGILONE_FEATURE_EXPLANATIONS=${VIGILONE_FEATURE_EXPLANATIONS:-false}
      - VIGILONE_FEATURE_OBJECT_CROPS=${VIGILONE_FEATURE_OBJECT_CROPS:-false}
      - VIGILONE_MODEL_EXCEPTIONS=/run/vigilone/model-license-exceptions.json
      - VIGILONE_AIR_GAPPED=${VIGILONE_AIR_GAPPED:-false}
      - INCIDENT_HOLD_PRE_SECONDS=${INCIDENT_HOLD_PRE_SECONDS:-60}
      - INCIDENT_HOLD_POST_SECONDS=${INCIDENT_HOLD_POST_SECONDS:-120}
      - INCIDENT_HOLD_DAYS=${INCIDENT_HOLD_DAYS:-90}
    volumes:
      - recordings_data:/recordings
      - appliance_keys:/etc/vigilone
      # Human approvals for candidate AI models (read-only; see docs/operations/ANPR.md)
      - ./scripts/models/model-license-exceptions.json:/run/vigilone/model-license-exceptions.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

  # AI worker (Phase 2). Opt-in: `docker compose --profile ai up -d`, after
  # `scripts/models/fetch-model.sh --dest ${VIGILONE_MODELS_DIR}`. It joins MediaMTX's network
  # namespace so rtsp://127.0.0.1:8554 IS MediaMTX (loopback + single-RTSP-stream invariants); it
  # never connects to cameras. Recording and evidence do not depend on it: stopping, crashing or
  # overloading it cannot affect them.
  # P4.1 ANPR (plate_recognition adapter + LPR camera runner). Its models are candidate models:
  # without a human approval in scripts/models/model-license-exceptions.json it refuses to run
  # (health FAILED, audited nowhere as success). Enable with --profile anpr and VIGILONE_FEATURE_ANPR.
  anpr-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    image: vigilone-ai-worker:latest
    container_name: vigilone-anpr-worker
    profiles: ["anpr"]
    restart: unless-stopped
    network_mode: "service:mediamtx"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - AI_WORKER_MODE=anpr
      - BACKEND_INTERNAL_URL=http://backend:4000/api/v1/internal
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      - MEDIAMTX_READ_USER=internal
      - MEDIAMTX_READ_PASSWORD=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      - VIGILONE_MODELS_DIR=/models
      - VIGILONE_MODEL_EXCEPTIONS=/run/vigilone/model-license-exceptions.json
      - AI_ADAPTER_HOST=127.0.0.1
      - AI_ADAPTER_PORT=7011
      - AI_EXIT_ON_REFUSAL=false
    volumes:
      - ${VIGILONE_MODELS_DIR:-./.cache/models}:/models:ro
      - ./scripts/models/model-license-exceptions.json:/run/vigilone/model-license-exceptions.json:ro
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M

  redaction-worker:
    # P4.4 redaction regions (YuNet faces + PP-OCRv4 plate regions) over ai-adapter.v1 for the
    # backend's redaction jobs. Candidate models: refuses (FAILED health) without human approvals;
    # redaction jobs then fail with REDACTION_DETECTOR_UNAVAILABLE. Enable with --profile privacy.
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    image: vigilone-ai-worker:latest
    container_name: vigilone-redaction-worker
    profiles: ["privacy"]
    restart: unless-stopped
    network_mode: "service:backend"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - AI_WORKER_MODE=redaction
      - BACKEND_INTERNAL_URL=http://127.0.0.1:4000/api/v1/internal
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      - VIGILONE_MODELS_DIR=/models
      - VIGILONE_MODEL_EXCEPTIONS=/run/vigilone/model-license-exceptions.json
      - AI_ADAPTER_HOST=127.0.0.1
      - AI_ADAPTER_PORT=7012
      - AI_EXIT_ON_REFUSAL=false
    volumes:
      - ${VIGILONE_MODELS_DIR:-./.cache/models}:/models:ro
      - ./scripts/models/model-license-exceptions.json:/run/vigilone/model-license-exceptions.json:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M

  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    image: vigilone-ai-worker:latest
    container_name: vigilone-ai-worker
    profiles: ["ai"]
    restart: unless-stopped
    network_mode: "service:mediamtx"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - AI_WORKER_MODE=pipeline
      - BACKEND_INTERNAL_URL=http://backend:4000/api/v1/internal
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      # Reads the loopback stream as the internal service user (MediaMTX authMethod: http)
      - MEDIAMTX_READ_USER=internal
      - MEDIAMTX_READ_PASSWORD=${INTERNAL_API_SECRET:-vigilone_internal_secret_token_98234}
      - AI_MODEL_KEY=${AI_MODEL_KEY:-yolox-tiny}
      - VIGILONE_MODELS_DIR=/models
      - AI_ADAPTER_HOST=127.0.0.1
      - AI_ADAPTER_PORT=7010
      - AI_DETECT_FPS=${AI_DETECT_FPS:-2}
      - AI_MAX_STREAMS=${AI_MAX_STREAMS:-16}
      - AI_GATE_MODE=${AI_GATE_MODE:-motion}
      # A refused model (bad SHA-256, disallowed licence) is audited once; the worker stays up with
      # health FAILED instead of restart-looping.
      - AI_EXIT_ON_REFUSAL=false
    volumes:
      - ${VIGILONE_MODELS_DIR:-./.cache/models}:/models:ro
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Synthetic test camera - isolated under profile 'test' (never runs in production)
  synthetic-camera:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: vigilone-synthetic-camera
    profiles: ["test"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - ffmpeg
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=1280x720:rate=25
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "50"
      - -f
      - rtsp
      - rtsp://internal:vigilone_internal_secret_token_98234@mediamtx:8554/synthetic_test_stream
    depends_on:
      - mediamtx
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vigilone-net

networks:
  vigilone-net:
    driver: bridge

volumes:
  pg_data:
  recordings_data:
  appliance_keys:
  caddy_data:
  caddy_config:


# MediaMTX Configuration for VigilOne VMS
# Edge-first, zero-transcode media engine

logLevel: info
logDestinations: [stdout]

# Control API - Bound to :9997 inside Docker network only
api: yes
apiAddress: :9997

# Authentication Webhook - Queries VigilOne Backend for all playback/read actions
authMethod: http
authHTTPAddress: http://backend:4000/api/v1/media/auth
authHTTPExclude:
  - action: api

# RTSP Configuration
rtsp: yes
rtspAddress: :8554
protocols: [tcp]

# WebRTC (WHEP) Egress Configuration - Scoped to Operator Management Interface
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: []

# HLS Egress Configuration
hls: yes
hlsAddress: :8888
hlsSegmentDuration: 2s
hlsPartDuration: 500ms

# Default Path Settings
pathDefaults:
  sourceOnDemand: no
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 10m
  recordPartDuration: 1s
  recordDeleteAfter: 0s
  # Retried for about two minutes (backend restarting). MediaMTX runs this command on its own goroutine, so the retries never delay
  # recording. A notice that still fails is caught by the 5-minute filesystem crawl.
  runOnRecordSegmentComplete: >-
    curl -fsS --max-time 5 --retry 12 --retry-delay 5 --retry-connrefused -X POST http://backend:4000/api/v1/internal/segment-complete -H "Authorization: Bearer $INTERNAL_API_SECRET" -H "Content-Type: application/json" -d '{"path":"$MTX_PATH","file":"$MTX_SEGMENT_PATH","duration":"$MTX_SEGMENT_DURATION"}'


# Path Configuration
paths:
  all_others:



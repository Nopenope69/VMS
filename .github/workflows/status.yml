name: Generated Test Status

# P0.5: test counts in PROJECT_STATE.md and docs/generated/ come only from this workflow.
# It runs the real suites on master, generates the status from Jest --json output (failures
# included) and commits the generated files. Humans and agents do not hand-edit them;
# `npm run check:status-docs` in CI catches hand edits.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: generated-test-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-status:
    name: Run suites and commit generated status
    runs-on: ubuntu-latest
    # Do not loop on the bot's own status commit.
    if: "!contains(github.event.head_commit.message, '[status-bot]')"

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: vigilone
          POSTGRES_PASSWORD: vigilone_ci_secret_password_2026!
          POSTGRES_DB: vigilone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilone -d vigilone_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_db?schema=public
      JWT_SECRET: vigilone_dev_jwt_signing_key_32bytes_min!
      CREDENTIAL_ENCRYPTION_KEY: eGlhOHBqa2w4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      INTERNAL_API_SECRET: vigilone_internal_secret_token_98234

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          (cd frontend && npm ci && npm run build)
          (cd backend && npm ci && npx prisma generate && npx prisma migrate deploy)
          # Same ai-worker setup as ci.yml: without onnxruntime-node and the pinned models the
          # native-engine tests fail and the golden-model suites are skipped.
          (cd services/ai-worker && ONNXRUNTIME_NODE_INSTALL=skip npm ci)

      # Same model set as the ai-worker job in ci.yml. With VIGILONE_REQUIRE_MODEL_TESTS=1 a golden-model suite
      # fails, never skips, when its model is missing: the SigLIP 2 and SmolVLM2 suites failed here from Phase 5
      # until this step fetched them.
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-siglip2-${{ hashFiles('scripts/models/pipelines/embedding-siglip2-v1.json') }}

      - name: Fetch pinned models (SHA-256 verified against scripts/models/models.lock.json)
        run: |
          scripts/models/fetch-model.sh yolox-nano && scripts/models/fetch-model.sh yolox-tiny
          scripts/models/fetch-model.sh ppocrv4-det && scripts/models/fetch-model.sh fast-plate-ocr-cct-s-v2 && scripts/models/fetch-model.sh yunet-2023mar
          scripts/models/fetch-model.sh siglip2-base-p16-224-vision && scripts/models/fetch-model.sh siglip2-base-p16-224-text

      - name: Cache llama.cpp build and VLM model files
        uses: actions/cache@v4
        with:
          path: |
            /tmp/llama.cpp/build/bin/llama-server
            .cache/models/SmolVLM2-2.2B-Instruct-Q4_K_M.gguf
            .cache/models/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf
          key: vlm-${{ hashFiles('scripts/models/pipelines/vlm-smolvlm2-v1.json') }}

      - name: Build llama-server (pinned llama.cpp) and fetch SmolVLM2 (SHA-256 verified)
        run: |
          TAG=$(node -p "require('./scripts/models/pipelines/vlm-smolvlm2-v1.json').llamaCpp.tag")
          COMMIT=$(node -p "require('./scripts/models/pipelines/vlm-smolvlm2-v1.json').llamaCpp.commit")
          if [ ! -x /tmp/llama.cpp/build/bin/llama-server ]; then
            git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
            test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "$COMMIT"
            cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF
            cmake --build /tmp/llama.cpp/build -j"$(nproc)" --target llama-server
          fi
          scripts/models/fetch-model.sh smolvlm2-2.2b-instruct-q4km && scripts/models/fetch-model.sh smolvlm2-2.2b-instruct-mmproj-q8

      - name: Cache query-rewrite model file
        uses: actions/cache@v4
        with:
          path: .cache/models/Qwen3-4B-Q4_K_M.gguf
          key: query-rewrite-${{ hashFiles('scripts/models/pipelines/query-rewrite-qwen3-4b-v1.json') }}

      - name: Fetch Qwen3-4B (SHA-256 verified; a candidate, tests and evaluation only)
        run: scripts/models/fetch-model.sh qwen3-4b-q4km

      - name: Backend suite (JSON report; failures are recorded, not hidden)
        working-directory: ./backend
        run: npx jest --runInBand --forceExit --json --outputFile=/tmp/backend-jest.json || echo "BACKEND_FAILED=1" >> "$GITHUB_ENV"

      - name: AI worker suite (JSON report)
        working-directory: ./services/ai-worker
        env:
          VIGILONE_REQUIRE_MODEL_TESTS: '1'
          VLM_LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: ../../backend/node_modules/.bin/jest --config jest.config.js --runInBand --json --outputFile=/tmp/ai-worker-jest.json || echo "AI_FAILED=1" >> "$GITHUB_ENV"

      - name: Generate status from the reports
        working-directory: ./backend
        run: npx ts-node scripts/ci/generate-status.ts --backend /tmp/backend-jest.json --ai-worker /tmp/ai-worker-jest.json

      - name: Commit generated status
        run: |
          git config user.name "vigilone-status-bot"
          git config user.email "vigilone-status-bot@users.noreply.github.com"
          git add docs/generated/TEST_STATUS.json docs/generated/TEST_STATUS.md PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "No status change."
          else
            git commit -m "docs(status): regenerate test status from CI run ${GITHUB_RUN_ID} [status-bot] [skip ci]"
            if ! git push; then
              # Rejected. If the branch moved on while the suites ran (two merges close together), this status
              # describes an older commit and the run for the newer commit writes its own: skip, do not fail.
              # Any other refusal is a real failure.
              git fetch origin "$GITHUB_REF_NAME"
              if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
                echo "::notice::$GITHUB_REF_NAME moved past $GITHUB_SHA during this run; its status is written by the newer run."
              else
                echo "::error::push of the generated status was refused"
                exit 1
              fi
            fi
          fi

      - name: Fail if any suite failed
        if: env.BACKEND_FAILED == '1' || env.AI_FAILED == '1'
        run: |
          echo "At least one suite failed; the generated status records the failures."
          exit 1

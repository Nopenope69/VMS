name: VigilOne Commercial CI

on:
  push:
    branches: [ master, main ]
  # Every PR, including PRs stacked on another feature branch (they otherwise get no CI at all).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build (tsc & vite build)
        working-directory: ./frontend
        run: npm run build

      - name: Production bundle contains no demo hazards
        working-directory: ./frontend
        run: npm run check:no-demo

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend-checks:
    name: Backend Typecheck, Migrations & Tests
    needs: [frontend-checks]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: vigilone
          POSTGRES_PASSWORD: vigilone_ci_secret_password_2026!
          POSTGRES_DB: vigilone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilone -d vigilone_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install ffmpeg (real fMP4 ingestion tests spawn ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Install MailHog 1.0.1 (MIT; SMTP interop tests)
        run: |
          curl -fsSL -o /tmp/MailHog https://github.com/mailhog/MailHog/releases/download/v1.0.1/MailHog_linux_amd64
          chmod +x /tmp/MailHog

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Prisma Client Generation
        working-directory: ./backend
        run: npx prisma generate

      - name: Backend Build & Typecheck (tsc)
        working-directory: ./backend
        run: npm run build

      - name: Verify Clean Database Migration Deploy
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_db?schema=public
        run: |
          echo "Applying migrations to fresh PostgreSQL service container..."
          npx prisma migrate deploy

      - name: Download Frontend Dist Artifact for Static Validation
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # A SIMULATED Modbus TCP I/O module for the relay and door tests (Phase 7), built on pymodbus.
      - name: Install Modbus simulator (test only)
        run: |
          python3 -m venv /tmp/modbussim
          /tmp/modbussim/bin/pip install --quiet -r tools/sim/requirements-modbus-sim.txt

      # A real OpenID Connect provider (oidc-provider, test only) for the SSO tests (Phase 8).
      - name: Install OIDC test provider
        run: npm ci --prefix tools/sim/oidc
      # An S3-compatible server for the off-site archive tests (Phase 6): moto, started so that after its setup
      # calls every request needs a valid SigV4 signature (S3_TEST_VERIFIES_AUTH). moto does not verify payload
      # hashes, so S3_TEST_VERIFIES_PAYLOAD stays off here.
      - name: Start S3 test server (moto, test only)
        run: |
          python3 -m venv /tmp/testsrv
          /tmp/testsrv/bin/pip install --quiet -r tools/sim/requirements-test-servers.txt
          INITIAL_NO_AUTH_ACTION_COUNT=3 nohup /tmp/testsrv/bin/moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:9000/moto-api/ && break; sleep 1; done
          read AK SK < <(/tmp/testsrv/bin/python tools/sim/moto_s3_with_auth.py http://127.0.0.1:9000)
          echo "::add-mask::$SK"
          echo "S3_TEST_ACCESS_KEY=$AK" >> "$GITHUB_ENV"
          echo "S3_TEST_SECRET_KEY=$SK" >> "$GITHUB_ENV"

      - name: Run Backend Regression Test Suite
        working-directory: ./backend
        env:
          MODBUS_SIM_PYTHON: /tmp/modbussim/bin/python
          VIGILONE_REQUIRE_MODBUS_SIM: '1'
          VIGILONE_REQUIRE_OIDC_SIM: '1'
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_VERIFIES_AUTH: '1'
          VIGILONE_REQUIRE_S3: '1'
          DATABASE_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_db?schema=public
          JWT_SECRET: vigilone_dev_jwt_signing_key_32bytes_min!
          CREDENTIAL_ENCRYPTION_KEY: eGlhOHBqa2w4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          INTERNAL_API_SECRET: vigilone_internal_secret_token_98234
          MAILHOG_BIN: /tmp/MailHog
          VIGILONE_REQUIRE_MAILHOG: '1'
        run: npm test

      # Live deployment: vigilonectl backup / restore against the real PostgreSQL service (only the docker compose
      # wrapper is simulated); a failing, truncated or altered backup must never pass.
      - name: vigilonectl backup and restore (real PostgreSQL)
        env:
          TEST_DB_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_backup_test
        run: bash scripts/__tests__/backup-restore.test.sh

  # The redaction console and DPDP settings driven in a real browser (Chromium, Playwright 1.56.1) against the
  # real backend and a seeded scratch database. Each test checks what the backend stored, not only the screen.
  frontend-browser-tests:
    name: Frontend Browser Tests (real backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: vigilone
          POSTGRES_PASSWORD: vigilone_ci_secret_password_2026!
          POSTGRES_DB: vigilone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilone -d vigilone_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          (cd backend && npm ci && npx prisma generate)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)

      - name: Browser tests
        env:
          TEST_DB_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_frontend_e2e
        run: scripts/e2e/frontend-browser.sh

  ai-worker-checks:
    name: AI Worker Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The ai-worker compiles and tests against the backend toolchain (tsc, jest, ts-jest, @types).
      - name: Install backend toolchain
        working-directory: ./backend
        run: npm ci

      - name: Install ffmpeg (frame extraction tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Install AI worker dependencies (onnxruntime-node, CPU binaries bundled)
        working-directory: ./services/ai-worker
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      # The SigLIP 2 towers are about 1.5 GB. Their identity is fixed by SHA-256 in the pipeline file, so
      # that file is the cache key, and fetch-model.sh still verifies every file it finds.
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-siglip2-${{ hashFiles('scripts/models/pipelines/embedding-siglip2-v1.json') }}

      - name: Fetch pinned models (SHA-256 verified against scripts/models/models.lock.json)
        run: |
          scripts/models/fetch-model.sh yolox-nano && scripts/models/fetch-model.sh yolox-tiny
          # ANPR candidate models (tests only; the product needs a human approval to run them)
          scripts/models/fetch-model.sh ppocrv4-det && scripts/models/fetch-model.sh fast-plate-ocr-cct-s-v2 && scripts/models/fetch-model.sh yunet-2023mar
          # SigLIP 2 candidate models (tests only, same rule)
          scripts/models/fetch-model.sh siglip2-base-p16-224-vision && scripts/models/fetch-model.sh siglip2-base-p16-224-text

      # llama-server for the VLM second opinion, built from the commit pinned in the pipeline file. The cache
      # key is that file, so a new pin rebuilds; the build step checks the tag still points at the commit.
      - name: Cache llama.cpp build and VLM model files
        uses: actions/cache@v4
        with:
          path: |
            /tmp/llama.cpp/build/bin/llama-server
            .cache/models/SmolVLM2-2.2B-Instruct-Q4_K_M.gguf
            .cache/models/mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf
          key: vlm-${{ hashFiles('scripts/models/pipelines/vlm-smolvlm2-v1.json') }}

      - name: Build llama-server (pinned llama.cpp) and fetch SmolVLM2 (SHA-256 verified)
        run: |
          TAG=$(node -p "require('./scripts/models/pipelines/vlm-smolvlm2-v1.json').llamaCpp.tag")
          COMMIT=$(node -p "require('./scripts/models/pipelines/vlm-smolvlm2-v1.json').llamaCpp.commit")
          if [ ! -x /tmp/llama.cpp/build/bin/llama-server ]; then
            git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
            test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "$COMMIT"
            cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF
            cmake --build /tmp/llama.cpp/build -j"$(nproc)" --target llama-server
          fi
          scripts/models/fetch-model.sh smolvlm2-2.2b-instruct-q4km && scripts/models/fetch-model.sh smolvlm2-2.2b-instruct-mmproj-q8

      - name: AI Worker Build (tsc)
        working-directory: ./services/ai-worker
        run: npm run build

      - name: AI Worker Tests (golden-model tests required, never skipped)
        working-directory: ./services/ai-worker
        env:
          VIGILONE_REQUIRE_MODEL_TESTS: '1'
          VLM_LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: npm test

      # Phase 8: the public adapter SDK. Its contract copy must match the backend, its server passes the
      # conformance kit, and its YOLOX-tiny example matches the official YOLOX code on the golden images.
      - name: AI adapter SDK (contract drift, build, tests with the real model)
        working-directory: ./sdk/ai-adapter
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          VIGILONE_REQUIRE_MODEL_TESTS: '1'
        run: npm ci && npm run check-contract && npm run build && npm test

      - name: ai-adapter.v1 conformance against the real worker
        run: |
          AI_WORKER_MODE=adapter-only AI_MODEL_KEY=yolox-tiny AI_ADAPTER_PORT=7010 node services/ai-worker/dist/main.js > /tmp/adapter.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7010/v1/health >/dev/null 2>&1 && break; sleep 1; done
          cd backend && npm run conformance:ai-adapter -- --url http://127.0.0.1:7010 --json /tmp/ai-adapter-conformance.json || { cat /tmp/adapter.log; exit 1; }

  ai-e2e-scenario:
    name: AI end-to-end scenario (SIMULATED camera, real model, MediaMTX, backend, worker)
    needs: [ai-worker-checks]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: vigilone
          POSTGRES_PASSWORD: vigilone_ci_secret_password_2026!
          POSTGRES_DB: vigilone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilone -d vigilone_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vigilone:vigilone_ci_secret_password_2026!@localhost:5432/vigilone_db?schema=public
      CREDENTIAL_ENCRYPTION_KEY: eGlhOHBqa2w4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install ffmpeg and MediaMTX 1.9.3 (same version as docker-compose.yml)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz | tar -xz -C /tmp mediamtx

      - name: Install dependencies and build
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          (cd backend && npm ci && npx prisma generate && npm run build && npx prisma migrate deploy)
          (cd services/ai-worker && npm ci && npm run build)
          scripts/models/fetch-model.sh yolox-tiny

      - name: Run scenario
        env:
          MEDIAMTX_BIN: /tmp/mediamtx
        run: scripts/e2e/ai-tripwire-scenario.sh /tmp/e2e-report.json

      - name: Run ANPR LPR scenario (SYNTHETIC plate, TEST-ONLY model approval)
        env:
          MEDIAMTX_BIN: /tmp/mediamtx
        run: |
          scripts/models/fetch-model.sh ppocrv4-det && scripts/models/fetch-model.sh fast-plate-ocr-cct-s-v2
          scripts/e2e/anpr-lpr-scenario.sh /tmp/anpr-e2e-report.json

      - name: Run high-availability failover scenario (two backend processes, one database)
        run: scripts/e2e/ha-failover.sh /tmp/ha-e2e-report.json

      - name: Run redaction scenario (SIMULATED recording, real detectors, TEST-ONLY model approval)
        run: |
          scripts/models/fetch-model.sh yunet-2023mar
          scripts/e2e/redaction-scenario.sh /tmp/redaction-e2e-report.json

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-siglip2-${{ hashFiles('scripts/models/pipelines/embedding-siglip2-v1.json') }}

      - name: Semantic search end to end (real SigLIP 2, real pgvector, public-domain pictures, evaluation-only approval bypass)
        working-directory: ./backend
        env:
          VIGILONE_REQUIRE_MODEL_TESTS: '1'
          JWT_SECRET: vigilone_dev_jwt_signing_key_32bytes_min!
          INTERNAL_API_SECRET: vigilone_internal_secret_token_98234
        run: |
          ../scripts/models/fetch-model.sh siglip2-base-p16-224-vision && ../scripts/models/fetch-model.sh siglip2-base-p16-224-text
          npx jest --runInBand src/__tests__/semanticSearchRealModels.test.ts

      - name: Multi-site scenario (two backend processes, two databases, cut link, site crash)
        run: scripts/e2e/federation-scenario.sh /tmp/federation-e2e-report.json

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-e2e-report
          path: |
            /tmp/federation-e2e-report.json
            /tmp/e2e-report.json
            /tmp/anpr-e2e-report.json
            /tmp/redaction-e2e-report.json
            /tmp/ha-e2e-report.json
          if-no-files-found: ignore

  governance-gates:
    name: Hygiene, Model Licence & Fail-Loud Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Repository hygiene gate
        working-directory: ./backend
        run: npm run check:hygiene

      - name: Model licence gate
        working-directory: ./backend
        run: npm run check:model-licenses

      - name: Fail-loud gate (no fake-success patterns outside the justified allowlist)
        working-directory: ./backend
        run: npm run check:no-fake-success

      - name: Generated test status has not been hand-edited
        working-directory: ./backend
        run: npm run check:status-docs

      - name: README feature-flag table is generated, not hand-typed
        working-directory: ./backend
        run: npm run check:feature-flag-docs

      - name: Dependency licence gate (backend, frontend, ai-worker lockfiles)
        working-directory: ./backend
        run: npm run check:dependency-licenses

      # Phase 8 certification preparation: CycloneDX SBOM of npm packages, pinned AI models and container images.
      - name: Release SBOM (CycloneDX)
        run: node scripts/release/generate-sbom.mjs dist-sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vigilone-sbom
          path: dist-sbom/

  field-tooling-checks:
    name: Field Validation Tooling (bench, fault, soak, acceptance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests (node --test)
        run: node --test scripts/lib/*.test.mjs scripts/soak/*.test.mjs

      - name: Evaluation harness tests (COCO metrics equal pycocotools on committed fixtures)
        run: node --test tools/eval/__tests__/*.test.mjs

      - name: Offline verifier syntax
        run: node --check tools/vigilone-verify/vigilone-verify.mjs && node --test tools/vigilone-verify/*.test.mjs

      - name: Shell syntax
        run: for f in scripts/fault/*.sh scripts/sim/*.sh scripts/acceptance/*.sh scripts/install-drill/*.sh tools/anpr/finetune/*.sh deploy/packaging/vigilonectl; do bash -n "$f" || exit 1; done && python3 -m py_compile tools/anpr/finetune/prepare_dataset.py tools/anpr/synth_plates.py

      - name: Compatibility matrix is generated from committed bench reports
        run: node scripts/bench/update-matrix.mjs --check

  packaging-and-installer-checks:
    name: Packaging, vigilonectl & Installer Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Installer & Packaging Test Suite
        run: bash scripts/__tests__/installer.test.sh

  docker-compose-validation:
    name: Docker Compose Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate base docker-compose.yml
        run: docker compose config -q

      - name: Validate production docker-compose override
        run: docker compose -f docker-compose.yml -f deploy/packaging/docker-compose.prod.yml config -q

  security-and-secret-scan:
    name: Secrets & Key Material Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Permanent Secret & Compromised Key Scanning Suite
        working-directory: ./backend
        run: npx jest src/__tests__/secretsAudit.test.ts --runInBand

